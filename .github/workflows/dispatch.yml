name: Dispatch

# Диспетчер доски: метка st:queued запускает исполнителя, выбранного меткой engine:*.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  claude:
    if: github.event.label.name == 'st:queued' && contains(github.event.issue.labels.*.name, 'engine:claude')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      N: ${{ github.event.issue.number }}
    steps:
      - name: Статус «в работе»
        run: gh issue edit "$N" -R "$GITHUB_REPOSITORY" --remove-label st:queued --add-label st:running
      - name: Запуск облачной сессии Claude
        env:
          FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
        run: |
          resp=$(curl -sS --fail-with-body -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"ENGINE=claude N=$N\"}") || {
              gh issue edit "$N" -R "$GITHUB_REPOSITORY" --remove-label st:running --add-label st:failed
              gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "## Отчёт
          Облачная сессия не запустилась: $resp"
              exit 1
            }
          url=$(echo "$resp" | jq -r .claude_code_session_url)
          gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "Запущена облачная сессия Claude: $url"

  hermes:
    if: github.event.label.name == 'st:queued' && contains(github.event.issue.labels.*.name, 'engine:hermes')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      N: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: |
          git config user.name "hermes-agent"
          git config user.email "hermes-agent@users.noreply.github.com"
          gh issue edit "$N" --remove-label st:queued --add-label st:running
      - name: Установка Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Запуск Hermes по протоколу
        run: |
          printf 'ENGINE=hermes N=%s\nВыполни протокол из .agent/PROTOCOL.md для этой задачи.\n' "$N" > /tmp/prompt.txt
          hermes chat --oneshot --provider anthropic --model "${HERMES_MODEL:-claude-sonnet-5-5}" \
            --max-turns 80 --yolo --query-file /tmp/prompt.txt
      - name: Превью ветки (пуш от GITHUB_TOKEN сам его не запускает)
        run: gh workflow run preview.yml -f branch="hermes/issue-$N"
      - name: Пометить провал, если задача осталась в работе
        if: always()
        run: |
          if gh issue view "$N" --json labels -q '.labels[].name' | grep -qx 'st:running'; then
            gh issue edit "$N" --remove-label st:running --add-label st:failed
            gh issue comment "$N" --body "## Отчёт
          Hermes завершился, не переведя задачу в st:review. Лог: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
