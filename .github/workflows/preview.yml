name: Preview

# Превью задачи агента: тесты, сборка в /preview/task-N/, отчёт тестов, ссылки комментарием в PR.
on:
  push:
    branches: ['claude/task-*']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.BRANCH }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Параметры
        run: |
          # Облако дописывает к ветке хвост (claude/task-5-bxeue1): номер задачи это число сразу после task-.
          TASK="${BRANCH#claude/task-}"
          echo "TASK=${TASK%%-*}" >> "$GITHUB_ENV"
          echo "REPO=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          echo "SITE=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - name: Тесты
        id: tests
        continue-on-error: true
        run: npx playwright install --with-deps chromium && npm test
      - name: Скриншоты страницы
        if: always()
        continue-on-error: true
        run: |
          # dist с базой «/» остался от npm test; отдаём его локально и снимаем главную в двух ширинах.
          mkdir -p shots
          npm run preview > /dev/null 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npx playwright screenshot --full-page --viewport-size=1280,800 http://localhost:4173/ shots/desktop.png
          npx playwright screenshot --full-page --viewport-size=390,800 http://localhost:4173/ shots/mobile.png
          kill "$PREVIEW_PID" || true
      - name: Сборка превью
        run: BASE="/$REPO/preview/task-$TASK/" npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: preview/task-${{ env.TASK }}
          keep_files: true
      - uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: preview/task-${{ env.TASK }}-report
          keep_files: true
      - uses: peaceiris/actions-gh-pages@v4
        if: always() && hashFiles('shots/desktop.png') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: shots
          destination_dir: preview/task-${{ env.TASK }}-shots
          keep_files: true
      - name: Ссылки в PR
        run: |
          result=$([ "${{ steps.tests.outcome }}" = "success" ] && echo "зелёные" || echo "КРАСНЫЕ")
          # Первый пуш приходит раньше, чем агент откроет PR: пропускаем, превью обновится со следующим коммитом.
          gh pr comment "$BRANCH" --body "## Превью
          - Сайт: $SITE/preview/task-$TASK/
          - Отчёт тестов со скриншотами: $SITE/preview/task-$TASK-report/
          - Скриншот (компьютер): $SITE/preview/task-$TASK-shots/desktop.png
          - Скриншот (телефон): $SITE/preview/task-$TASK-shots/mobile.png
          - Тесты в облаке: $result" || echo "PR ещё не открыт, комментарий пропущен"
