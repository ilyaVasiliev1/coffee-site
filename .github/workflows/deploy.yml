name: Deploy

# Выкладка на сервер проекта: main на прод, staging на бету. Нужны секреты репозитория:
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (ключ, которому разрешён только rrsync в каталог сайтов), DEPLOY_KNOWN_HOSTS.
# На сервере: каталоги prod/ и staging/ в корне rrsync, nginx отдаёт прод на 80, бету на 8080.
on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Выкладка на сервер
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ "$GITHUB_REF_NAME" = "main" ]; then TARGET=prod; PORT=80; else TARGET=staging; PORT=8080; fi
          rsync -rt --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/"
          # Сайт должен реально отвечать после выкладки.
          curl -fsS --retry 3 --retry-delay 2 "http://$DEPLOY_HOST:$PORT/" > /dev/null
